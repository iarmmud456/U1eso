const MR=Math.random.bind(Math);let rnd=MR,seed=0;const mul=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=(a,b)=>Math.floor(rnd()*(b-a+1))+a,P=a=>a[R(0,a.length-1)],f=n=>n.toLocaleString('es-ES'),S=(b,e)=>`${b}<sup>${e}</sup>`;
const gcd=(a,b)=>b?gcd(b,a%b):a,sh=a=>[...a].sort(()=>rnd()-.5);
const ft=(n,d)=>d==1?''+n:`${n}/${d}`,rd=(n,d)=>{const g=gcd(n,d);return[n/g,d/g]},Q=(t,n,d,r)=>{const[x,y]=rd(n,d);return{t,a:x/y,s:ft(x,y),fr:[x,y],red:r}},ans=q=>q.s!=null?q.s:String(q.a);
const dc=x=>String(+x.toFixed(6)).replace('.',','),Dd=(t,x)=>({t,a:+x.toFixed(6),s:dc(x),dec:1}),fx=(x,k)=>x.toFixed(k).replace('.',','),fs=([n,d])=>`${n}/${d}`,num=x=>+x.replace(',','.');
const rs=()=>{const k=R(1,3);let t='';for(let i=0;i<k;i++)t+=R(0,9);if(t.endsWith('0'))t=t.slice(0,-1)+R(1,9);return t},dl=()=>{const e=R(1,9);let L;do{L=Array.from({length:4},()=>`${e},${rs()}`)}while(new Set(L.map(num)).size<4);return L};
const isEx=d=>{d/=gcd(d,1);while(d%2==0)d/=2;while(d%5==0)d/=5;return d==1};
const z=n=>n<0?'−'+(-n):''+n,nz=(a,b)=>{let x=0;while(!x)x=R(a,b);return x},sg=n=>n<0?'− '+(-n):'+ '+n;
const SV=(w,h,i)=>`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Ilustración" style="max-width:${w}px;width:100%;height:auto">${i}</svg>`;
const gr=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const lcm=(a,b)=>a/gcd(a,b)*b,isP=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i==0)return false;return true};
const divs=n=>{const d=[];for(let i=1;i<=n;i++)if(n%i==0)d.push(i);return d};
const fac=a=>a.filter(([p,e])=>e>0).map(([p,e])=>e>1?S(p,e):p).join(' · ');
const val=a=>a.reduce((s,[p,e])=>s*p**e,1);
const tx_=(x,y,t,s,b)=>`<text class="gt" x="${x}" y="${y}" text-anchor="middle" style="font-size:${s||14}px;${b?'font-weight:700':''}">${t}</text>`;
const critFig=()=>SV(320,128,tx_(160,18,'Criterios de divisibilidad',13,1)+['Por 2: acaba en cifra par','Por 3: la suma de sus cifras es múltiplo de 3','Por 5: acaba en 0 o en 5','Por 9: la suma de sus cifras es múltiplo de 9','Por 10: acaba en 0'].map((t,i)=>tx_(160,42+i*20,t,12)).join(''));
const rectFig=(a,b)=>SV(260,140,`<rect class="gs" x="50" y="40" width="160" height="80"/>${tx_(130,30,a+' dm',12)}${tx_(130,86,'baldosas cuadradas',12,1)}${tx_(232,84,b+' dm',12)}`);
const opt=(c,w)=>{c=String(c);let u=[...new Set(w.map(String))].filter(x=>x!=c&&!/^-/.test(x));if(/^\d+$/.test(c))for(const k of [1,-1,2,10,-2,3,5,-3]){const v=String(+c+k);if(u.length>=3)break;if(+v>=0&&v!=c&&!u.includes(v))u.push(v)}return[c,...sh(u).slice(0,3)]};
const TXQ=(t,s,w,hh,g)=>({t,tx:1,s,a:0,mc:1,o:opt(s,w),hh,g});
const cop=()=>{let p,q;do{p=R(2,9);q=R(2,9)}while(gcd(p,q)!=1);return[p,q]};
const dig=(mod,pre,post)=>{let d;const ok=x=>(String(pre).split('').concat(String(x),String(post).split('')).reduce((s,c)=>s+ +c,0))%mod==0;for(d=0;d<10&&!ok(d);d++);return d};
const B=[
{n:'Múltiplos de un número',e:'✖️',T:[[
()=>{const a=R(3,19);return{t:`Calcula la suma de los tres primeros múltiplos de ${a} distintos de 0.`,a:6*a,hh:`Los múltiplos de ${a} son ${a}, ${2*a}, ${3*a}... Escribe los tres primeros y suma.`}},
()=>{const a=R(6,19),N=R(60,190);return{t:`¿Cuál es el menor múltiplo de ${a} que es mayor que ${N}?`,a:(Math.floor(N/a)+1)*a,hh:`Divide ${N} entre ${a}: el cociente te dice cuántas veces cabe. Sube al siguiente múltiplo.`}},
()=>{const a=R(4,12),N=R(60,150);return{t:`¿Cuántos múltiplos de ${a} hay entre 1 y ${N}, ambos incluidos?`,a:Math.floor(N/a),hh:`Divide ${N} entre ${a} y quédate con la parte entera del cociente.`}}],
[()=>{const a=R(7,15),k=R(4,14),c=a*k;return TXQ(`¿Cuál de estos números es múltiplo de ${a}?`,String(c),[c+1,c-1,c+a-2,c-a+3].map(String),'Un número es múltiplo de a si la división entre a es exacta.')}]]},
{n:'Divisores de un número',e:'➗',T:[[
()=>{const N=P([12,18,20,24,28,30,36,40,45,48,50,60]);return{t:`¿Cuántos divisores tiene el número ${N}?`,a:divs(N).length,hh:`Prueba a dividir ${N} entre 1, 2, 3... Cada división exacta te da dos divisores (el divisor y su cociente).`}},
()=>{const N=P([12,18,20,28,30,36,40,42,45,48]);return{t:`¿Cuánto suman los divisores de ${N} que son menores que ${N}?`,a:divs(N).reduce((s,x)=>s+x,0)-N,hh:'Escribe todos los divisores y suma todos menos el propio número.'}}],
[()=>{const N=P([24,36,48,60,72,84,90]),d=divs(N).filter(x=>x>1&&x<N),w=sh(d).slice(0,3);let x;do{x=R(4,N-1)}while(N%x==0);return TXQ(`¿Cuál de estos números NO es divisor de ${N}?`,String(x),w.map(String),`Un divisor de ${N} lo divide de forma exacta, sin resto.`)}]]},
{n:'Criterios de divisibilidad',e:'🔍',T:[[
()=>{let x,y,m,d;do{x=R(1,9);y=R(1,9);m=P([3,9]);d=dig(m,x,y)}while(d==0);return{t:`¿Cuál es la menor cifra que hay que poner en lugar del * para que el número ${x}*${y} sea divisible por ${m}?`,a:d,g:critFig(),alt:'Criterios de divisibilidad',hh:`Suma las cifras que ves y busca qué cifra hay que añadir para que el total sea múltiplo de ${m}.`}}],
[()=>{const c=30*R(4,30),w1=6*(5*R(3,15)+R(1,4)),w2=15*(2*R(2,20)+1),w3=10*(3*R(3,30)+R(1,2));return TXQ('¿Cuál de estos números es divisible por 2, 3 y 5 a la vez?',String(c),[w1,w2,w3].map(String),'Comprueba cada criterio: cifra final par, suma de cifras múltiplo de 3 y acabado en 0 o en 5.')}]]},
{n:'Números primos y compuestos',e:'🔢',T:[[
()=>{const p=P([53,59,61,67,71,73,79,83,89,97]);return TXQ('¿Cuál de estos números es primo?',String(p),[51,57,87,91,93,77,85,95,119,133,121,143,161].sort(()=>rnd()-.5).slice(0,3).map(String),'Un número primo solo tiene dos divisores: 1 y él mismo. Busca un divisor en 2, 3, 5, 7...')}],
[()=>{const a=10*R(1,5),b=a+R(15,25),n=[...Array(b+1).keys()].filter(x=>x>a&&x<b&&isP(x)).length;return{t:`¿Cuántos números primos hay entre ${a} y ${b}?`,a:n,hh:`Revisa los números entre ${a} y ${b} descartando los pares, los que acaban en 5 y los múltiplos de 3 o de 7.`}},
()=>{const N=R(11,22),s=[...Array(N).keys()].filter(isP).reduce((x,y)=>x+y,0);return{t:`¿Cuánto suman todos los números primos menores que ${N}?`,a:s,hh:'Escribe los primos 2, 3, 5, 7, 11... menores que ese número y súmalos. Recuerda que el 1 no es primo.'}}]]},
{n:'Descomposición en factores primos',e:'🌳',T:[[
()=>{const a=R(2,4),b=R(2,3),c=P([5,7]);return{t:`Calcula el número que se obtiene con ${fac([[2,a],[3,b],[c,1]])}.`,a:2**a*3**b*c,hh:'Calcula cada potencia y multiplica los resultados.'}},
()=>{const x=R(2,5),N=2**x*15;return{t:`Si ${S(2,'x')} · 3 · 5 = ${N}, ¿cuánto vale x?`,a:x,hh:`Divide ${N} entre 3 y entre 5 y pregúntate cuántos 2 hay que multiplicar para obtener el resultado.`}}],
[()=>{const a=R(2,4),b=R(2,3),N=2**a*3**b*5,f=(x,y)=>fac([[2,x],[3,y],[5,1]]);return TXQ(`Descompón ${gr(N)} en factores primos.`,f(a,b),[f(a+1,b),f(a,b+1),f(a-1,b),f(a,b-1)],'Divide entre 2 mientras puedas, después entre 3 y entre 5. Los exponentes cuentan cuántas veces se repite cada primo.')}]]},
{n:'Máximo común divisor (mcd)',e:'🔗',T:[[
()=>{const g=R(2,12),[p,q]=cop();return{t:`Calcula el mcd de ${g*p} y ${g*q}.`,a:gcd(g*p,g*q),hh:'Descompón los dos números en factores primos y multiplica los factores comunes con el menor exponente.'}},

St.forEach(b=>b.forEach(q=>{let s=it[k++];if(s[0]=='h'){q.hu=1;s=s.slice(1)}const c=s[0],v=s.slice(1);if(c=='n')return;q.ans=v;q.tries=c=='a'||c=='w'?1:2;if(c=='w'){q.msg='Casi. Repasa el recuadro "Recuerda" e inténtalo otra vez.';if(q.o)q.bad=[typeof q.o[0]=='number'?+v:v]}else{q.pts=c=='a'?pen(1,q):c=='b'?pen(.5,q):0;q.msg=c!='z'?okm(q):'La solución era '+(typeof ans=='function'?ans(q):f(q.a))+'. ¡Fíjate cómo se hace!'}}));
document.getElementById('nm').value=a[2];document.getElementById('cs').value=a[3];cur=Math.min(+a[1],1);mode=null;draw();return''}catch(e){return'Código no válido, incompleto o de otra unidad. Revisa que lo has copiado entero.'}}
const pnl=h=>{document.getElementById('pn').innerHTML=h};
function svOpen(){const c=mkCode();pnl(`<div class="card"><h2>Tu código de progreso</h2><p>Copia este código y guárdalo. Para continuar, abre de nuevo el enlace, pulsa «Continuar con un código» y pégalo.</p><textarea id="cdt" readonly rows="5" style="width:100%">${c}</textarea><p><button class="go" onclick="cpCode()">Copiar código</button> <button class="go" onclick="pnl('')">Cerrar</button> <span class="msg good" id="cpm"></span></p><p class="sub">Longitud del código: ${c.length} caracteres</p></div>`)}
function cpCode(){const t=document.getElementById('cdt'),m=document.getElementById('cpm');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}
if(!ok&&navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>m.textContent='Copiado.',()=>m.textContent='Selecciona el texto y cópialo a mano.');else m.textContent=ok?'Copiado.':'Selecciona el texto y cópialo a mano.'}
function ldOpen(){pnl(`<div class="card"><h2>Continuar con un código</h2><p>Pega aquí tu código de progreso:</p><textarea id="cdi" rows="4" style="width:100%"></textarea><p><button class="go" onclick="ldGo()">Cargar</button> <button class="go" onclick="pnl('')">Cerrar</button></p><p class="msg wrong" id="ldm" role="status"></p></div>`)}
function ldGo(){const m=ldCode(document.getElementById('cdi').value);if(m)document.getElementById('ldm').textContent=m;else pnl('')}
start();
say(PRES,'cheer');
loadVoices();
</script>
